# vim:fileencoding=utf-8:foldmethod=marker

# {{{ Terminal (tuned for kitty)
set -g default-terminal "tmux-256color"
# Truecolor, OSC 52 clipboard, hyperlinks, undercurl, synchronized output,
# extended keys, titles and focus events
set -as terminal-features ",xterm-kitty:RGB:clipboard:hyperlinks:usstyle:sync:extkeys:title:focus"
set -as terminal-features ",wezterm*:RGB"
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events on
set -sg escape-time 10
# Let kitty graphics (unicode placeholders), notifications and user vars through
set -g allow-passthrough on
# Name the kitty tab after the session and window
set -g set-titles on
set -g set-titles-string "#S: #W"
# }}}

# {{{ General
set -g default-shell /usr/bin/fish
set -g mouse on
set -g history-limit 50000
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
# Keep the server alive with no sessions so continuum can restore after start-server
set -s exit-empty off
# }}}

# {{{ Clipboard
# Copies go to the clipboard through kitty (OSC 52, also works over ssh) and to
# the primary selection through wl-copy, matching kitty's copy_on_select.
# Hold shift to select with kitty instead of tmux.
set -s set-clipboard on
set -s copy-command "wl-copy -p"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
# }}}

# {{{ Keys
# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reorder windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
# }}}

# {{{ Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# tmux-resurrect: restore pane contents and these programs
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh btop htop yazi lazygit'

# tmux-continuum: save every 5 minutes, restore when the server starts
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
# }}}

# {{{ Theme: Catppuccin Mocha
set -g @catppuccin_flavor 'mocha'
# Rounded window pills. The built-in 'rounded' style draws its caps in reverse
# video against the status bar color, which breaks on an unpainted bar, so the
# caps are drawn directly in each pill's colors instead.
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_number_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]"
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator "#[fg=#{@catppuccin_window_text_color},bg=default]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_number_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]"
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator "#[fg=#{@catppuccin_window_current_text_color},bg=default]"
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_directory_text ' #{s|^#{HOME}|~|:pane_current_path}'
# Leave the status bar unpainted so kitty's background opacity shows through
set -g @catppuccin_status_background 'none'
# Fill the text half of each status pill with its icon's colors
set -g @catppuccin_status_directory_text_bg '#{E:@catppuccin_directory_color}'
set -g @catppuccin_status_directory_text_fg '#{E:@thm_crust}'
set -g @catppuccin_status_session_text_bg '#{E:@catppuccin_session_color}'
set -g @catppuccin_status_session_text_fg '#{E:@thm_crust}'
# Round both ends of each pill, drawn on the unpainted bar
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_status_right_separator " "

# Install tpm and the plugins on first start
if 'test ! -d ~/.config/tmux/plugins/tpm' \
	"run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# catppuccin must load before the status line uses its modules
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
# tmux 3.8 underlines the current window by default; the pill color marks it
set -g window-status-current-style default
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}'
# }}}

# Initialize tpm (keep at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
